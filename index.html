<body>
<a class="skip-link" href="#main">Skip to the page</a>

<header class="head" id="head">
  <a class="brand" href="#top" aria-label="Swapnil Mishra, back to the top">
    <svg class="brand-mark" viewBox="0 0 26 30" aria-hidden="true"><rect x="0" y="0" width="26" height="4"/><rect x="2" y="6.5" width="22" height="5" class="a"/><rect x="2" y="13" width="22" height="5"/><rect x="2" y="19.5" width="22" height="5"/><rect x="0" y="26" width="26" height="4"/></svg>
    <span>Swapnil Mishra</span>
  </a>
  <div class="head-right">
    <span class="cred"><img src="assets/img/iim-nagpur-crest.jpg" width="77" height="26" alt="IIM Nagpur crest"><span data-t="cred.short"></span></span>
    <a class="btn btn-ink btn-sm" data-href="links.booking" target="_blank" rel="noopener"><span data-t="cta.callShort"></span></a>
  </div>
</header>

<main id="main">

<section class="hero" id="top" aria-labelledby="heroTitle">
  <div class="hero-copy">
    <div class="hero-ask">
      <p class="eyebrow mono" data-t="hero.eyebrow"></p>
      <h1 id="heroTitle" data-t="hero.title"></h1>
      <form class="ask" id="askForm" novalidate>
        <label class="sr-only" for="askInput" data-t="hero.label"></label>
        <div class="ask-field">
          <input id="askInput" name="company" type="text" autocomplete="organization" autocapitalize="words" spellcheck="false" maxlength="48" enterkeyhint="go" aria-describedby="askHelp">
          <button class="ask-go" type="submit" aria-label="Build it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
        <div class="ask-meta"><span id="askHelp" data-t="hero.help"></span><button type="button" id="askSkip" data-t="hero.skip"></button></div>
        <p class="ask-private mono" data-t="hero.privacy"></p>
      </form>
    </div>
    <div class="hero-built" id="heroBuilt" tabindex="-1">
      <p class="eyebrow mono" data-t="hero.builtEyebrow"></p>
      <h2 class="h1" data-t="hero.builtTitle"></h2>
      <p class="hero-sub" data-t="hero.builtSub"></p>
      <div class="hero-cta">
        <a class="btn btn-primary down" href="#floors"><span data-t="hero.builtCta"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></a>
        <a class="btn btn-line" data-href="links.booking" target="_blank" rel="noopener"><span data-t="cta.call"></span></a>
      </div>
      <div class="hero-tweak">
        <button type="button" class="link" id="renameBtn" data-t="hero.rename"></button>
        <span class="swatches" id="swatches" role="group" data-aria="hero.colour"></span>
      </div>
    </div>
  </div>
  <div class="hero-stage" id="heroStage">
    <div class="bld-wrap">
      <div class="bld-host" id="heroBuilding"></div>
      <div class="floor-keys" id="floorKeys"></div>
    </div>
  </div>
  <p class="sr-only" aria-live="polite" id="live"></p>
</section>

<section class="intro" id="floors" aria-labelledby="floorsTitle">
  <div class="wrap">
    <p class="eyebrow mono" data-t="floorsIntro.eyebrow"></p>
    <h2 id="floorsTitle" class="h2" data-t="floorsIntro.title"></h2>
    <p class="lead" data-t="floorsIntro.sub"></p>
    <p class="sample-note" id="sampleNote"><span data-t="floorsIntro.sampleNote"></span> <a class="link" href="#top">&uarr;</a></p>
  </div>
</section>
<div id="floorList"></div>

<section class="plan" id="plan" aria-labelledby="planTitle">
  <div class="wrap plan-grid">
    <div class="plan-intro">
      <p class="eyebrow mono" data-t="plan.eyebrow"></p>
      <h2 id="planTitle" class="h2" data-t="plan.title"></h2>
      <p class="lead" data-t="plan.sub"></p>
      <div class="plan-floors">
        <p class="mono" data-t="plan.floorsLabel"></p>
        <div class="lift" id="planLift" role="group" data-aria="plan.floorsLabel"></div>
        <p class="plan-empty" id="planEmpty" data-t="plan.floorsEmpty"></p>
      </div>
    </div>
    <div class="plan-box">
      <form class="quiz" id="quiz" novalidate></form>
      <div class="paper-wrap" id="paperWrap" hidden>
        <article class="paper" id="paper" tabindex="-1" aria-label="Your one-page plan"></article>
        <div class="paper-actions">
          <a class="btn btn-primary" href="#look"><span data-t="cta.look"></span></a>
          <a class="btn btn-ink" data-href="links.booking" target="_blank" rel="noopener"><span data-t="cta.call"></span></a>
          <a class="btn btn-line" id="planSend" href="#"><span data-t="plan.actions.send"></span></a>
          <button class="btn btn-line" type="button" id="planPrint"><span data-t="plan.actions.print"></span></button>
          <button class="link" type="button" id="planAgain" data-t="plan.actions.again"></button>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="reels on-night" id="reels" aria-labelledby="reelsTitle">
  <div class="wrap">
    <p class="eyebrow mono" data-t="reels.eyebrow"></p>
    <h2 id="reelsTitle" class="h2" data-t="reels.title"></h2>
    <p class="lead" data-t="reels.sub"></p>
  </div>
  <div class="reel-wall" id="reelWall" aria-hidden="true"></div>
  <div class="wrap"><p class="fine" data-t="reels.note"></p></div>
</section>

<section class="after" id="after" aria-labelledby="afterTitle">
  <div class="wrap">
    <p class="eyebrow mono" data-t="timeline.eyebrow"></p>
    <h2 id="afterTitle" class="h2" data-t="timeline.title"></h2>
    <p class="shape-label"><span data-t="timeline.label"></span></p>
    <div class="tl" id="tl"></div>
  </div>
</section>

<section class="dont on-night" id="dont" aria-labelledby="dontTitle">
  <div class="wrap">
    <h2 id="dontTitle" class="h2 dont-title" data-t="dont.title"></h2>
    <ol class="dont-list" id="dontList"></ol>
    <p class="dont-end"><a href="#look" data-t="dont.end"></a></p>
  </div>
</section>

<section class="look" id="look" aria-labelledby="lookTitle">
  <div class="wrap look-grid">
    <div>
      <p class="eyebrow mono" data-t="freeLook.eyebrow"></p>
      <h2 id="lookTitle" class="h2" data-t="freeLook.title"></h2>
      <p class="lead" data-t="freeLook.sub"></p>
      <p class="slots" id="slots"></p>
    </div>
    <form class="look-form" id="lookForm" novalidate>
      <div class="field"><label for="lfName" data-t="freeLook.fields.name"></label><input id="lfName" name="name" type="text" autocomplete="name" required></div>
      <div class="field"><label for="lfCompany" data-t="freeLook.fields.company"></label><input id="lfCompany" name="company" type="text" autocomplete="organization" required></div>
      <div class="field"><label for="lfProblem" data-t="freeLook.fields.problem"></label><textarea id="lfProblem" name="problem" rows="2" required></textarea></div>
      <div class="field"><label for="lfReach" data-t="freeLook.fields.reach"></label><input id="lfReach" name="reach" type="text" autocomplete="email" required></div>
      <p class="form-error" id="lookError" role="alert" hidden></p>
      <div class="look-actions">
        <button class="btn btn-primary" type="submit"><span data-t="freeLook.send"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <span class="or" data-t="freeLook.or"></span>
        <a class="btn btn-line" data-href="links.booking" target="_blank" rel="noopener"><span data-t="cta.call"></span></a>
      </div>
      <p class="fine" data-t="freeLook.how"></p>
    </form>
  </div>
</section>

<section class="close on-night" id="close" aria-labelledby="closeTitle">
  <div class="wrap close-grid">
    <div class="close-copy">
      <p class="eyebrow mono" data-t="close.eyebrow"></p>
      <h2 id="closeTitle" class="h2 close-title" data-t="close.title"></h2>
      <p class="lead" data-t="close.sub"></p>
      <div class="hero-cta">
        <a class="btn btn-primary" href="#look"><span data-t="cta.look"></span></a>
        <a class="btn btn-line" data-href="links.booking" target="_blank" rel="noopener"><span data-t="cta.call"></span></a>
      </div>
      <ul class="reach">
        <li><span class="mono" data-t="close.emailLabel"></span><a class="link" data-href="links.email" data-t="links.email"></a></li>
        <li><span class="mono" data-t="close.linkedinLabel"></span><a class="link" data-href="links.linkedin" target="_blank" rel="noopener">Swapnil Mishra</a></li>
      </ul>
    </div>
    <div class="close-stage"><div class="bld-host" id="closeBuilding"></div></div>
  </div>
  <footer class="foot wrap">
    <div class="who">
      <img class="crest" src="assets/img/iim-nagpur-crest.jpg" width="107" height="36" alt="IIM Nagpur crest" loading="lazy">
      <div><p class="who-name" data-t="close.who"></p><p data-t="cred.line"></p><p class="who-about" data-t="close.about"></p><p class="fine" data-t="cred.note"></p></div>
    </div>
    <p class="fine foot-line"><span data-t="close.copyright"></span><span data-t="close.foot"></span></p>
  </footer>
</section>

</main>

<div class="dock" id="dock" hidden>
  <div class="lift" id="dockLift" role="group" aria-label="Floors"></div>
  <a class="btn btn-primary btn-sm" href="#plan" id="dockPlan"></a>
</div>
